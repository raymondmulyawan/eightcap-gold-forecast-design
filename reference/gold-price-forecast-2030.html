document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

         <h1 style=\"font-family:'Poppins',sans-serif;font-size:56px;line-height:1.05;font-weight:600;letter-spacing:-0.02em;margin:0 0 20px\">Gold price forecast to 2030: what analysts predict<\u002Fh1>\n          <p style=\"font-size:19px;line-height:1.55;color:#2B3A32;margin:0 0 24px;max-width:580px\">Where could gold be by 2030, and what are analysts saying right now? This gold price forecast covers today's price, historical averages, named bank and research predictions, and Eightcap's own scenarios.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:12px;font-size:14px;color:#2B3A32\">\n            <span style=\"font-weight:600;color:#0B0F14\">Last updated 29 October 2026<\u002Fspan>\n            <span style=\"opacity:.4\">|<\u002Fspan>\n            <span>Reviewed by Jack McKay, Risk Manager<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:400px;align-self:end;overflow:hidden\">\n          <img src=\"204f7dac-18fa-4275-ae32-b6e032acafab\" alt=\"Gold bars beside an XAU/USD price chart\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"height:6px;background:linear-gradient(90deg,#3EB86B 0%,#3EB86B 45%,#6C5CE7 100%)\"><\u002Fdiv>\n\n  <div style=\"padding:0 48px\">\n    <div style=\"max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid #ECEFEE\">\n      <div style=\"display:flex;align-items:center;gap:16px\">\n        <span style=\"font-size:12px;font-weight:600;font-family:'Poppins',sans-serif;color:#1F7A45;background:#E4F7EC;padding:6px 12px;border-radius:20px\">6 min read<\u002Fspan>\n        <span style=\"font-size:14px;color:#5B6560\">Refreshed after each Fed meeting or major bank target change<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <div style=\"width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none\"><image-slot id=\"gf-author-avatar-top\" shape=\"circle\" placeholder=\"Author\" style=\"width:32px;height:32px\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font-size:14px;color:#0B0F14\">Eightcap Market Analysts<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 48px 96px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:80px;align-items:start\">\n\n    <aside style=\"position:sticky;top:112px;padding-top:56px\">\n      <div style=\"font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5B6560;margin-bottom:16px\">In this article<\u002Fdiv>\n      <nav style=\"display:flex;flex-direction:column;gap:2px;border-left:2px solid #ECEFEE\">\n        <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"9\">\n          <a href=\"{{ t.href }}\" style=\"font-size:14px;line-height:1.4;color:#2B3A32;text-decoration:none;padding:8px 0 8px 16px;margin-left:-2px;border-left:2px solid transparent\" style-hover=\"border-left:2px solid #3EB86B;color:#0B0F14\">{{ t.label }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <div style=\"margin-top:32px;padding:20px;background:#F4F6F5;border-top:3px solid #3EB86B\">\n        <div style=\"font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;line-height:1.3;margin-bottom:8px\">Follow the gold price live<\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:#5B6560;margin:0 0 14px\">XAUUSD on TradingView, MT4, MT5 and TradeLocker.<\u002Fp>\n        <a href=\"/en-au/traders/trade/xauusd/\" style=\"display:inline-block;font-size:13px;font-weight:600;color:#fff;background:#6C5CE7;padding:9px 16px;border-radius:20px;text-decoration:none\">View live chart<\u002Fa>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"max-width:800px;padding-top:56px\">\n\n      <section id=\"summary\" style=\"background:#F4F6F5;padding:32px 36px;margin-bottom:56px;border-top:3px solid #3EB86B\">\n        <div style=\"font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A45;margin-bottom:14px\">Before you read<\u002Fdiv>\n        <p style=\"font-size:16px;line-height:1.7;color:#2B3A32;margin:0 0 16px\">No one knows where gold will be in 2030. Most banks only publish targets for the next 12 to 24 months, and the 2030 figures you see quoted are scenarios rather than a consensus. Every gold price prediction on this page is dated and labelled as a base case, bull scenario or third-party estimate.<\u002Fp>\n        <p style=\"font-size:15px;line-height:1.6;color:#0B0F14;margin:0;padding-top:16px;border-top:1px solid #E1E5E3\"><strong>Remember:<\u002Fstrong> forecasts are opinions that change often. Treat every number here as general information, not advice.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"news\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Gold news: what is moving the price<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">Interest rates and the dollar have been the main story this autumn. These are the developments traders are watching, each with its date and source. For background, see <a href=\"/en-au/traders/insights/blogs/what-drives-the-price-of-gold/\">what drives the price of gold<\u002Fa> and <a href=\"/en-au/traders/insights/blogs/nfps-effect-on-gold-prices/\">how Nonfarm Payrolls can affect gold<\u002Fa>.<\u002Fp>\n        <div style=\"border-top:1px solid #E4E7E6\">\n          <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"5\">\n            \n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"today\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Gold price today<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">Gold traded at $[price] an ounce at [time] on [date], about [x]% below its 29 January record. Prices are quoted in US dollars per troy ounce, and figures differ slightly between sources.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1px;background:#E4E7E6;border:1px solid #E4E7E6;margin-bottom:16px\">\n          <div style=\"background:#0B0F14;padding:26px 24px;color:#fff\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#3EE07F;margin-bottom:10px\">XAUUSD · [date, time]<\u002Fdiv>\n            <div style=\"font-family:'Poppins',sans-serif;font-size:36px;font-weight:600;letter-spacing:-0.02em\">$4,070<\u002Fdiv>\n            <a href=\"/en-au/traders/trade/xauusd/\" style=\"display:inline-block;margin-top:12px;font-size:14px;font-weight:600;color:#fff\">Live price →<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:26px 22px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5B6560;margin-bottom:10px\">Record high<\u002Fdiv>\n            <div style=\"font-family:'Poppins',sans-serif;font-size:28px;font-weight:600;color:#1F7A45\">$5,405<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.5;color:#5B6560;margin:6px 0 0\">29 Jan 2026, LBMA PM price<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:26px 22px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5B6560;margin-bottom:10px\">2026 low so far<\u002Fdiv>\n            <div style=\"font-family:'Poppins',sans-serif;font-size:28px;font-weight:600;color:#0B0F14\">~$3,943<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.5;color:#5B6560;margin:6px 0 0\">30 Jun 2026, broker report<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:#8A938E;margin:0\">Year-to-date change: [x]%. Source and time to be confirmed on the day of publishing.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"history\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Historical gold price performance<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">Gold averaged $1,160 an ounce in 2015, then climbed to $3,432 in 2025. The table shows the annual average on an LBMA basis in US dollars per ounce. 2026 is a part-year, so there is no full-year average yet.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid #E4E7E6;margin-bottom:36px\">\n          <sc-for list=\"{{ historyCols }}\" as=\"col\" hint-placeholder-count=\"2\">\n            <div style=\"{{ col.style }}\">\n              <div style=\"display:flex;justify-content:space-between;padding:12px 20px;background:#0B0F14;color:#fff;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600\"><span>Year<\u002Fspan><span>Avg (USD/oz)<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ col.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div style=\"{{ r.style }}\"><span>{{ r.y }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.v }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        \n        <ol style=\"list-style:none;margin:0 0 28px;padding:0;border-left:2px solid #D7F5E2\">\n          <sc-for list=\"{{ turns }}\" as=\"t\" hint-placeholder-count=\"5\">\n            \n          <\u002Fsc-for>\n        <\u002Fol>\n        <p style=\"font-size:16px;line-height:1.65;color:#1B2620;margin:0\">Gold has often held up when growth slows. Read <a href=\"/en-au/traders/insights/blogs/what-happens-to-the-value-of-gold-during-a-recession/\">how gold performs in a recession<\u002Fa>. Past performance does not predict future prices.<\u002Fp>\n      <\u002Fsection>\n\n      <figure style=\"margin:0 0 56px\">\n        <img src=\"5a8a8032-ef3d-4380-9b72-668acee428b8\" alt=\"Gold bars with a candlestick chart overlay\" style=\"width:100%;height:360px;object-fit:cover;display:block\">\n      <\u002Ffigure>\n\n      <section id=\"analysts\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Gold price predictions from banks and analysts<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 20px\">There is no real consensus for 2030. Banks mostly publish 12 to 24 month targets, and the longer-range numbers that circulate are scenarios built on specific assumptions. We have not averaged them into a single figure, because they measure different things over different horizons.<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">Each figure below is dated and labelled by type. The World Gold Council publishes demand data, not price forecasts.<\u002Fp>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;border:1px solid #E4E7E6;font-size:14px;margin-bottom:40px\">\n          <sc-raw-thead>\n            <sc-raw-tr style=\"background:#0B0F14\">\n              <sc-raw-th style=\"text-align:left;padding:14px 16px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#fff;width:22%\">Source<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left;padding:14px 16px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#fff;width:22%\">Figure (USD/oz)<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left;padding:14px 16px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#fff;width:38%\">Horizon<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left;padding:14px 16px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#fff;width:18%\">Type<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ forecasts }}\" as=\"f\" hint-placeholder-count=\"10\">\n              <sc-raw-tr style=\"{{ f.rowStyle }}\">\n                <sc-raw-td style=\"padding:14px 16px;font-weight:700;vertical-align:top\">{{ f.src }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;color:#0B0F14;font-weight:600;vertical-align:top;font-variant-numeric:tabular-nums\">{{ f.fig }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;color:#2B3A32;line-height:1.55;vertical-align:top\">{{ f.horizon }}<span style=\"display:block;font-size:12px;color:#8A938E;margin-top:4px\">{{ f.where }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 16px;vertical-align:top\"><span style=\"{{ f.tagStyle }}\">{{ f.type }}<\u002Fspan><\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <h3 style=\"font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;margin:0 0 14px\">How targets changed in 2026<\u002Fh3>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 16px\">In early July, JPMorgan cut its Q4 2026 target to $4,500 from about $6,000, citing weaker demand from key buyers and gold's greater sensitivity to real rates, while keeping a positive medium-term view.<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 36px\">Goldman Sachs moved its end-2026 target from $5,400 in January to $4,650 in September, and kept $5,400 for end-2027. Forecasts changed a lot this year, which is a reason to treat long-range numbers carefully.<\u002Fp>\n        <h3 style=\"font-family:'Poppins',sans-serif;font-size:24px;font-weight:600;margin:0 0 14px\">What forecasts say about 2030<\u002Fh3>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 16px\">JPMorgan's $8,000 figure for the end of the decade is a bull scenario from 29 January 2026, not its base case. It depends on private investors lifting their gold allocations from about 3% to 4.6%. Incrementum's In Gold We Trust 2026 report points to about $8,900 by the end of 2030.<\u002Fp>\n        <div style=\"border-left:3px solid #0B0F14;padding:4px 0 4px 24px\">\n          <p style=\"font-size:18px;line-height:1.7;color:#0B0F14;margin:0\">The spread between the lowest and highest forecasts is wide, and that is the point. Long-range gold figures describe what could happen if certain conditions hold, not what will happen.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"display:flex;align-items:center;gap:28px;background:#D7F5E2;padding:28px 32px;margin-bottom:56px\">\n        <div style=\"flex:1\">\n          <div style=\"font-family:'Poppins',sans-serif;font-size:20px;font-weight:600;margin-bottom:8px\">Follow gold with Eightcap<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:#2B3A32;margin:0\">See the live XAUUSD chart on TradingView, MT4, MT5 or TradeLocker, or practise on a free demo account first.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;flex:none\">\n          <a href=\"/en-au/traders/trade/xauusd/\" style=\"text-align:center;font-size:14px;font-weight:600;color:#fff;background:#6C5CE7;padding:11px 22px;border-radius:22px;text-decoration:none\">View live gold chart<\u002Fa>\n          <a href=\"#top\" style=\"text-align:center;font-size:14px;font-weight:600;color:#0B0F14;background:transparent;border:1px solid #0B0F14;padding:10px 22px;border-radius:22px;text-decoration:none\">Try a demo<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section id=\"sentiment\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Gold sentiment in the news<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 20px\">Views are split. BCA sees gold as oversold below $4,000 but doubts a quick rally (26 October). Sucden warns of a drop toward $3,900 if the Fed keeps tightening (28 October), while State Street says a path to $5,000 remains even as downside risks build (27 October).<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">For regular commentary, follow Eightcap's <a href=\"/en-au/traders/knowledge-hub/market-insights/\">Market Insights<\u002Fa>.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;border:1px solid #E4E7E6;padding:24px 28px\">\n          <div style=\"font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1F7A45\">Positioning<\u002Fdiv>\n          <p style=\"font-size:16px;line-height:1.6;color:#1B2620;margin:0\">Gold ETFs took in about US$10 billion in September, while managed-money positions in futures fell. <span style=\"color:#8A938E\">(World Gold Council, 7 Oct 2026)<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"scenarios\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">Eightcap's analysis: gold price scenarios<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">These are scenarios, not predictions. Each one sets out what would have to be true, and what to watch on the <a href=\"/en-au/traders/knowledge-hub/economic-calendar/\">economic calendar<\u002Fa> to tell which path gold is on.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:28px\">\n          <sc-for list=\"{{ scenarios }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"{{ s.cardStyle }}\">\n              <div style=\"{{ s.labelStyle }}\">{{ s.label }}<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-serif;font-size:19px;font-weight:600;line-height:1.3;margin-bottom:14px\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5B6560;margin-bottom:6px\">What would have to be true<\u002Fdiv>\n              <p style=\"font-size:14px;line-height:1.6;color:#2B3A32;margin:0 0 16px\">{{ s.truth }}<\u002Fp>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5B6560;margin-bottom:6px\">What to watch<\u002Fdiv>\n              <p style=\"font-size:14px;line-height:1.6;color:#2B3A32;margin:0 0 20px;flex:1\">{{ s.watch }}<\u002Fp>\n              <div style=\"padding-top:16px;border-top:1px solid #E4E7E6\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5B6560;margin-bottom:6px\">Eightcap range, end-2027 / 2030<\u002Fdiv>\n                <div style=\"font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;color:#6C5CE7\">[Eightcap analyst to supply]<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 16px\">Our analyst's view depends on three things: the path of US interest rates, the dollar, and whether central bank buying continues. A clear Fed pivot back to easing would shift the balance toward the bull case, while 10-year yields holding above 5% would strengthen the bear case.<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0\">Some banks cite $4,000 as a lower bound, with Morgan Stanley calling it a strong floor. Bank of America's $3,750 target for Q4 2026 shows that downside views exist too.<\u002Fp>\n      <\u002Fsection>\n\n      <figure style=\"margin:0 0 56px\">\n        <img src=\"f1f05a3c-0bb8-4f8f-ad8b-c1e6b76da8f0\" alt=\"Stacked gold bars in front of a candlestick chart\" style=\"width:100%;height:360px;object-fit:cover;display:block\">\n      <\u002Ffigure>\n\n      <section id=\"use\" style=\"margin-bottom:56px\">\n        <h2 style=\"font-family:'Poppins',sans-serif;font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-0.015em;margin:0 0 20px\">How to use gold forecasts<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.75;color:#1B2620;margin:0 0 28px\">Treat every forecast as one possible path. Check its date and assumptions, and plan your position size and stop-loss for the case where it is wrong. Our guides on <a href=\"/en-au/traders/insights/blogs/how-to-manage-risk-while-trading-cfds/\">managing risk<\u002Fa> and <a href=\"/en-au/traders/insights/blogs/trading-plan-what-you-need-to-know/\">building a trading plan<\u002Fa> cover both in more depth.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n          <sc-for list=\"{{ tips }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:#F4F6F5;padding:22px 20px\">\n              <div style=\"font-family:'Poppins',sans-serif;font-size:28px;font-weight:600;color:#3EB86B;line-height:1;margin-bottom:14px\">{{ t.n }}<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;margin-bottom:6px\">{{ t.title }}<\u002Fdiv>\n              <p style=\"font-size:14px;line-height:1.55;color:#5B6560;margin:0\">{{ t.body }}<\u002Fp>\n
